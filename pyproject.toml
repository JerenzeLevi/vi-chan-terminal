[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vi-chan-terminal"
version = "0.1.0"
description = "A kawaii, Claude-Code-style AI agent for your terminal. Bring any API key."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Jerenze Levi", email = "omandamjerenze@gmail.com" }]
keywords = ["ai-agent", "terminal", "cli", "llm", "mcp", "openai", "gemini", "claude", "ollama"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Environment :: Console",
]
dependencies = [
  "openai>=1.40",
  "rich>=13.7",
  "prompt_toolkit>=3.0",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "mcp>=1.0",
]

[project.urls]
Homepage = "https://github.com/JerenzeLevi/vi-chan-terminal"
Issues = "https://github.com/JerenzeLevi/vi-chan-terminal/issues"

[project.scripts]
vichan = "vichan.app:main"
vi-chan = "vichan.app:main"

[tool.setuptools]
packages = ["vichan", "vichan.tools"]
